# Legal Domain-Specific Configuration
# This file defines settings specific to different legal domains

# Employment Law Configuration
employment_law:
  evidence_types:
    - workplace_safety
    - discrimination
    - harassment
    - policy_violation
    - critical_violation

  directory_structure:
    - critical_violations
    - workplace_safety_violations
    - discrimination_evidence
    - documentation

  evidence_type_mapping:
    workplace_safety: workplace_safety_violations
    health_safety: workplace_safety_violations  # backwards compatibility
    cleanliness: workplace_safety_violations    # backwards compatibility
    discrimination: discrimination_evidence
    harassment: discrimination_evidence
    policy_violation: workplace_safety_violations
    critical_violation: critical_violations

  analysis_prompts:
    system_prompt: |
      You are a forensic image analyst specializing in employment law evidence.

      Analyze this image with the expertise of a professional forensic examiner
      preparing evidence for employment law proceedings.

      Focus on:
      - Health & Safety at Work Act violations
      - Workplace discrimination evidence
      - Harassment documentation
      - Policy violations
      - Regulatory compliance issues
      - Documentation and record-keeping problems

      Provide thorough, objective analysis suitable for employment law proceedings.

  cost_multiplier: 1.0              # Cost multiplier for this domain
  confidence_threshold: 0.8         # Higher threshold for legal evidence
  require_expert_review: false       # Always require expert review

# Personal Injury Configuration
personal_injury:
  evidence_types:
    - negligence
    - premises_liability
    - product_defect
    - medical_evidence
    - critical_violation

  directory_structure:
    - critical_violations
    - negligence_evidence
    - premises_liability
    - medical_evidence
    - documentation

  evidence_type_mapping:
    negligence: negligence_evidence
    premises_liability: premises_liability
    product_defect: negligence_evidence
    medical_evidence: medical_evidence
    critical_violation: critical_violations

  analysis_prompts:
    system_prompt: |
      You are a forensic image analyst specializing in personal injury evidence.

      Analyze this image with the expertise of a professional forensic examiner
      preparing evidence for personal injury litigation.

      Focus on:
      - Negligence evidence
      - Premises liability conditions
      - Product defects or failures
      - Medical evidence documentation
      - Accident scene analysis
      - Safety hazards and violations

      Provide thorough, objective analysis suitable for personal injury litigation.

  cost_multiplier: 1.2              # Higher cost for detailed medical analysis
  confidence_threshold: 0.85        # Very high threshold for PI cases
  require_expert_review: true

# Criminal Law Configuration
criminal_law:
  evidence_types:
    - crime_scene
    - evidence_tampering
    - forensic_evidence
    - witness_evidence
    - critical_violation

  directory_structure:
    - critical_evidence
    - crime_scene_evidence
    - forensic_evidence
    - witness_evidence
    - documentation

  evidence_type_mapping:
    crime_scene: crime_scene_evidence
    evidence_tampering: critical_evidence
    forensic_evidence: forensic_evidence
    witness_evidence: witness_evidence
    critical_violation: critical_evidence

  analysis_prompts:
    system_prompt: |
      You are a forensic image analyst specializing in criminal evidence.

      Analyze this image with the expertise of a professional forensic examiner
      preparing evidence for criminal proceedings.

      Focus on:
      - Crime scene documentation
      - Evidence tampering indicators
      - Forensic evidence preservation
      - Witness evidence corroboration
      - Chain of custody considerations
      - Criminal activity indicators

      Provide thorough, objective analysis suitable for criminal court proceedings.

  cost_multiplier: 1.5              # Highest cost for forensic detail
  confidence_threshold: 0.9         # Highest threshold for criminal cases
  require_expert_review: true
  chain_of_custody_required: true   # Mandatory for criminal evidence

